[package]
name = "richclip-labeld"
version.workspace = true
edition.workspace = true

[[bin]]
name = "richclip-labeld"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
richclip = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.12"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
uuid = "1.23.2"
