name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "chore: release X.Y.Z" PR from conventional commits. Merging
  # that PR bumps the version, tags it, and cuts a GitHub Release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only runs on the push that merges the release PR (release_created == true).
  # Builds a release binary per target and attaches it to the fresh Release.
  # richclip is a Wayland tool, so the targets are Linux-only.
  upload-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev
      - name: Build
        # --workspace builds both binaries: the richclip CLI (root crate) and
        # the richclipd daemon (richclip-wayland crate).
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          staging="richclip-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}"
          bindir="target/${{ matrix.target }}/release"
          mkdir "$staging"
          cp "$bindir/richclip" "$bindir/richclipd" "$staging/"
          cp README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET" --clobber

